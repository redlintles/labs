---
- name: "Configure Client"
  hosts: all
  become: true

  handlers:
    - name: restart_rsyslog
      ansible.builtin.service:
        name: rsyslog
        state: restarted

  tasks:
    - name: "Update cache"
      ansible.builtin.dnf:
        update_cache: true

    - name: "config"
      ansible.builtin.dnf:
        name:
          - curl
          - nmap
          - iputils
          - rsyslog
          - iperf3
          - traceroute
          - httpd-tools
          - tcpdump
        state: present
    - name: Configure remote logging
      ansible.builtin.copy:
        dest: /etc/rsyslog.d/10-forward.conf
        src: files/config/rsyslog-client.conf
        owner: root
        group: root
        mode: 0644
      notify: restart_rsyslog

    - name: Ensure remote logging is running
      ansible.builtin.systemd_service:
        name: rsyslog
        state: started
        enabled: true
